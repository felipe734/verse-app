name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *" # 6:00 en Bogotá: revisa que ningún ID del mapeo haya desaparecido

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # Valor de prueba solo para CI; el real vive en Vercel.
          AUTH_SECRET: solo-para-pruebas-de-ci-no-es-secreto
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  mapeo-vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
    steps:
      - id: token
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::warning::Falta el secreto AIRTABLE_TOKEN en GitHub. La prueba en vivo del mapeo no corrió."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.hay == 'si'
        uses: actions/checkout@v4
      - if: steps.token.outputs.hay == 'si'
        uses: pnpm/action-setup@v4
      - if: steps.token.outputs.hay == 'si'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.token.outputs.hay == 'si'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.hay == 'si'
        run: pnpm test:vivo
